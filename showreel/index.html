<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Showreel 2026</title>
<link rel="stylesheet" href="fonts.css">
<style>
  :root { --bg:#0A0A0C; --ink:#F4EFE6; --lime:#C8FF2E; --mute:#8A8A99; --line:#2A2A33; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "JetBrains Mono", ui-monospace, monospace; }
  body.capture { overflow: hidden; }
  body.capture canvas { width: 1920px; height: 1080px; display: block; }
  body.capture .ui { display: none; }
  body.capture .wrap { max-width: none; padding: 0; margin: 0; }
  body.capture canvas { border-radius: 0; }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 32px 16px; }
  canvas { width: 100%; aspect-ratio: 16 / 9; display: block; background: #000; border-radius: 6px; }
  .ui { display: flex; gap: 16px; align-items: center; margin-top: 14px; font-size: 13px; letter-spacing: .08em; }
  button { font: inherit; background: var(--lime); color: var(--bg); border: 0; padding: 10px 18px; border-radius: 999px; cursor: pointer; font-weight: 700; letter-spacing: .1em; }
  input[type=range] { flex: 1; accent-color: var(--lime); }
  .tc { color: var(--mute); min-width: 110px; text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="c" width="1920" height="1080"></canvas>
  <div class="ui">
    <button id="play">▶ PLAY</button>
    <input id="scrub" type="range" min="0" max="15" step="0.001" value="0">
    <span class="tc" id="tc">00:00:00:00</span>
  </div>
</div>
<script src="reel.js"></script>
<script src="audio.js"></script>
<script>
(async function () {
  const capture = new URLSearchParams(location.search).has('capture');
  if (capture) document.body.classList.add('capture');
  const canvas = document.getElementById('c');
  await Reel.init(canvas, { mb: capture ? Number(new URLSearchParams(location.search).get('mb') || 1) : 1 });
  window.__reelReady = true;
  if (capture) return;

  const playBtn = document.getElementById('play'), scrub = document.getElementById('scrub'), tc = document.getElementById('tc');
  let actx = null, buffer = null, src = null, startAt = 0, offset = 0, playing = false;
  const fmt = t => { const f = Math.min(Math.round(t * 60), 899); return `00:00:${String(Math.floor(f / 60)).padStart(2, '0')}:${String(f % 60).padStart(2, '0')}`; };
  const show = t => { Reel.draw(t); scrub.value = t; tc.textContent = fmt(t); };
  show(14.2);

  async function start(at) {
    if (!actx) { actx = new AudioContext(); playBtn.textContent = '… RENDERING AUDIO'; buffer = await ReelAudio.render(actx.sampleRate); }
    if (src) { src.onended = null; src.stop(); }
    src = actx.createBufferSource(); src.buffer = buffer; src.connect(actx.destination);
    src.start(0, at); startAt = actx.currentTime - at; playing = true; playBtn.textContent = '❚❚ PAUSE';
    src.onended = () => { if (playing) start(0); };
    requestAnimationFrame(loop);
  }
  function stop() { playing = false; offset = actx.currentTime - startAt; if (src) { src.onended = null; src.stop(); src = null; } playBtn.textContent = '▶ PLAY'; }
  function loop() { if (!playing) return; const t = actx.currentTime - startAt; if (t < 15) show(t); requestAnimationFrame(loop); }
  playBtn.onclick = () => (playing ? stop() : start(offset >= 14.99 ? 0 : offset));
  scrub.oninput = () => { offset = Number(scrub.value); if (playing) start(offset); else show(offset); };
})();
</script>
</body>
</html>
